[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-sv-common"
version = "0.1.0"
description = "Shared L0 library for Mars Street View"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "numpy>=1.26",
  "pyproj>=3.6",
  "rasterio>=1.4",
  "jsonschema>=4.21",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
rover = [
  "pandas>=2.2",
  "pyarrow>=15",
  "pillow>=10",
  "scipy>=1.11",
  "requests>=2.31",
  "fast-simplification>=0.1",
]

[tool.setuptools.packages.find]
include = ["common*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "raw", "work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
